<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Materias del profesor</title>
    <link rel="stylesheet" href="../static/css/estilo.css">
</head>
<body>

<header>
    <h2>Sistema de Evaluación Docente</h2>
    <nav><a href="index.html">Inicio</a> | <a href="menu.html">Menú principal</a></nav>
</header>

<main>

<h1>Materias del profesor</h1>
<section class="tarjeta">
    <h2>Profesor: Juan Pérez López</h2>
    <h3>Materias que imparte</h3>
    <table><tr><th>Materia</th><th>Acciones</th></tr>
        <tr><td>Bases de Datos</td><td><a class="boton chico peligro" href="#">Quitar</a> </td></tr>
        <tr><td>Programación Orientada a Objetos</td><td><a class="boton chico peligro" href="#">Quitar</a> </td></tr>
    </table>
</section>
<section class="tarjeta">
    <h3>Asignar otra materia</h3>
    <form id="formAsignar" action="#" method="post" novalidate>
        <label for="materia">Materias disponibles</label>
        <select id="materia" name="materia" required>
            <option value="">-- Elige una materia --</option>
            <option>Proyecto Integrador I</option>
        </select>
        <button type="submit">Asignar</button>
    </form>
</section>
</main>

<script>
    // ---- Utilidades comunes (alertas y marcado de campos con error) ----
    function avisar(msg, campo) {
        alert(msg);
        if (campo) { campo.classList.add('invalido'); campo.focus(); }
    }
    document.addEventListener('input', function (e) { e.target.classList.remove('invalido'); });
    document.addEventListener('change', function (e) { e.target.classList.remove('invalido'); });

    var form = document.getElementById('formAsignar');
    var materia = document.getElementById('materia');

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (materia.value === '' || materia.selectedIndex === 0) { avisar('Elige una materia para asignar.', materia); return; }
        alert('Materia asignada correctamente:\n' + materia.value);
        form.reset();
    });
</script>

</body>
</html>

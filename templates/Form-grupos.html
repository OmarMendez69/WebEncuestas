<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grupos</title>
    <link rel="stylesheet" href="../static/css/estilo.css">
</head>
<body>

<header>
    <h2>Sistema de Evaluación Docente</h2>
    <nav><a href="index.html">Inicio</a> | <a href="menu.html">Menú principal</a></nav>
</header>

<main>

<h1>Grupos</h1>

<section class="tarjeta">
    <h2>Nuevo grupo</h2>
    <form id="formGrupo" action="#" method="post" novalidate>
        <label for="nombre">Nombre del grupo</label>
        <input type="text" id="nombre" name="nombre" maxlength="7"
            autocomplete="off" placeholder="Ejemplo: GTID243" required>
        <button type="submit">Guardar</button>
    </form>
</section>

<section class="tarjeta">
    <h2>Grupos registrados</h2>
    <table>
        <tr><th>Nombre</th><th>Acciones</th></tr>
        <tr>
            <td>GTID232</td>
            <td><a class="boton chico" href="#">Editar</a> <a class="boton chico peligro" href="#">Eliminar</a></td>
        </tr>
        <tr>
            <td>GTID243</td>
            <td><a class="boton chico" href="#">Editar</a> <a class="boton chico peligro" href="#">Eliminar</a></td>
        </tr>
    </table>
</section>

</main>

<script>
    function avisar(msg, campo) {
        alert(msg);
        if (campo) {
            campo.classList.add('invalido');
            campo.focus();
        }
    }

    document.addEventListener('input', function(e) {
        e.target.classList.remove('invalido');
    });

    var form = document.getElementById('formGrupo');
    var nombre = document.getElementById('nombre');
    var tabla = document.querySelector('table');

    // Convertir a mayúsculas y quitar espacios
    nombre.addEventListener('input', function() {
        nombre.value = nombre.value.toUpperCase().replace(/\s/g, '');
    });

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        var valor = nombre.value;

        if (valor === '') {
            avisar('Escribe el nombre del grupo. Ejemplo: GTID243', nombre);
            return;
        }

        if (valor.length !== 7) {
            avisar('El grupo debe tener 7 caracteres. Ejemplo: GTID243', nombre);
            return;
        }

        if (!/^GTID[1-9]{3}$/.test(valor)) {
            avisar('El grupo debe comenzar con con cuatro letras mayusculas y tener 3 números del 1 al 9. Ejemplo: GTID243', nombre);
            return;
        }

        // Revisar si el grupo ya existe
        for (var i = 1; i < tabla.rows.length; i++) {
            if (tabla.rows[i].cells[0].textContent === valor) {
                avisar('Ese grupo ya está registrado: ' + valor, nombre);
                return;
            }
        }

        // Agregar el grupo a la tabla
        var fila = tabla.insertRow(-1);
        fila.insertCell(0).textContent = valor;
        fila.insertCell(1).innerHTML = '<a class="boton chico" href="#">Editar</a> <a class="boton chico peligro" href="#">Eliminar</a>';

        alert('Grupo guardado correctamente: ' + valor);

        form.reset();
        nombre.focus();
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Registro de Materias</title>
    <link rel='stylesheet' href='main.css'>
</head>

<body>

    <h1>Registro de Materias</h1>

    <form id="formularioMateria">

        <label for="materia">Nombre de la materia:</label>
        <input type="text" id="materia" required>

        <button type="submit">Registrar materia</button>

    </form>

    <h2>Materias registradas</h2>

    <div id="listaMaterias"></div>

    <script>

        let materias = [];

        document.getElementById("formularioMateria").addEventListener("submit", function(event) {

            event.preventDefault();

            let materia = document.getElementById("materia").value;

            materias.push(materia);

            document.getElementById("listaMaterias").innerHTML = "";

            for (let i = 0; i < materias.length; i++) {

                document.getElementById("listaMaterias").innerHTML +=
                    "<p>" + (i + 1) + ". " + materias[i] + "</p>";

            }

            document.getElementById("formularioMateria").reset();

        });

    </script>

</body>
</html>

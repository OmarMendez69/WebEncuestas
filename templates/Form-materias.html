<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Materias</title>
    <link rel="stylesheet" href="../static/css/estilo.css">
</head>
<body>

<header>
    <h2>Sistema de Evaluación Docente</h2>
    <nav><a href="index.html">Inicio</a> | <a href="menu.html">Menú principal</a></nav>
</header>

<main>

<h1>Materias</h1>
<section class="tarjeta">
    <h2>Registrar materia</h2>
    <form id="formMateria" action="#" method="post" novalidate>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" minlength="3" maxlength="100" autocomplete="off" title="Entre 3 y 100 caracteres. Cada palabra debe comenzar con mayúscula." placeholder="Ejemplo: Programación Orientada a Objetos" required>

        <label for="estatus">Estatus</label>
        <select id="estatus" name="estatus" required>
            <option>Activo</option>
            <option>Inactivo</option>
        </select>

        <button type="submit">Guardar</button>
    </form>
</section>

<section class="tarjeta">
    <h2>Materias registradas</h2>
    <table>
        <tr>
            <th>Nombre</th>
            <th>Estatus</th>
            <th>Acciones</th>
        </tr>
        <tr>
            <td>Bases de Datos</td>
            <td>Activo</td>
            <td><a class="boton chico" href="#">Editar</a> <a class="boton chico peligro" href="#">Eliminar</a></td>
        </tr>
        <tr>
            <td>Programación Orientada a Objetos</td>
            <td>Activo</td>
            <td><a class="boton chico" href="#">Editar</a> <a class="boton chico peligro" href="#">Eliminar</a></td>
        </tr>
        <tr>
            <td>Proyecto Integrador I</td>
            <td>Activo</td>
            <td><a class="boton chico" href="#">Editar</a> <a class="boton chico peligro" href="#">Eliminar</a></td>
        </tr>
    </table>
</section>

</main>

<script>
    // ---- Utilidades comunes ----
    function avisar(msg, campo) {
        alert(msg);
        if (campo) {
            campo.classList.add('invalido');
            campo.focus();
        }
    }

    document.addEventListener('input', function (e) {
        e.target.classList.remove('invalido');
    });

    document.addEventListener('change', function (e) {
        e.target.classList.remove('invalido');
    });

    function limpiar(s) {
        return s.replace(/\s+/g, ' ').trim();
    }

    function sinAcentos(s) {
        return s.normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase();
    }

    function existeEnTabla(tabla, texto) {
        var buscado = sinAcentos(texto);

        for (var i = 1; i < tabla.rows.length; i++) {
            if (sinAcentos(limpiar(tabla.rows[i].cells[0].textContent)) === buscado) {
                return true;
            }
        }

        return false;
    }

    var form = document.getElementById('formMateria');
    var nombre = document.getElementById('nombre');
    var estatus = document.getElementById('estatus');
    var tabla = document.querySelector('table');

    var RE_MATERIA = /^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9][A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9 .,:;()\/&'+\-]*$/;

    function validarMateria(v) {
        if (v === '') {
            return 'Escribe el nombre de la materia.';
        }

        if (v.length < 3) {
            return 'El nombre de la materia debe tener al menos 3 caracteres.';
        }

        if (v.length > 100) {
            return 'El nombre de la materia no puede pasar de 100 caracteres.';
        }

        if (!RE_MATERIA.test(v)) {
            return 'Debe empezar con letra o número y solo puede llevar letras, números, espacios y . , : ; ( ) / & + -';
        }

        if ((v.match(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/g) || []).length < 3) {
            return 'El nombre debe tener al menos 3 letras.';
        }

        if (/(.)\1\1/i.test(v)) {
            return 'El nombre tiene el mismo carácter repetido 3 veces seguidas.';
        }

        // NUEVA VALIDACIÓN:
        // Cada palabra debe comenzar con mayúscula.
        var palabras = v.split(' ');

        for (var i = 0; i < palabras.length; i++) {
            if (palabras[i].length > 0) {
                var primeraLetra = palabras[i].match(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/);

                if (primeraLetra && primeraLetra[0] !== primeraLetra[0].toLocaleUpperCase('es-MX')) {
                    return 'La primera letra de cada palabra debe ser mayúscula. Ejemplo: Bases De Datos.';
                }
            }
        }

        return '';
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();

        var valor = limpiar(nombre.value);
        var error = validarMateria(valor);

        if (error) {
            avisar(error, nombre);
            return;
        }

        if (estatus.value !== 'Activo' && estatus.value !== 'Inactivo') {
            avisar('Elige un estatus válido (Activo o Inactivo).', estatus);
            return;
        }

        valor = valor.charAt(0).toUpperCase() + valor.slice(1);

        if (existeEnTabla(tabla, valor)) {
            avisar('Esa materia ya está registrada:\n' + valor, nombre);
            return;
        }

        // DEMO sin base de datos (se pierde al recargar).
        var tr = tabla.insertRow(-1);

        tr.insertCell(-1).textContent = valor;
        tr.insertCell(-1).textContent = estatus.value;

        tr.insertCell(-1).innerHTML =
            '<a class="boton chico" href="#">Editar</a> ' +
            '<a class="boton chico peligro" href="#">Eliminar</a>';

        alert('Materia guardada correctamente:\n' + valor + ' (' + estatus.value + ')');

        form.reset();
        nombre.focus();
    });
</script>

</body>
</html>

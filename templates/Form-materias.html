<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Materias</title>
    <link rel="stylesheet" href="../static/css/estilo.css">
</head>
<body>

<header>
    <h2>Sistema de Evaluación Docente:</h2>
</header>

<main>

<h1>Materias</h1>
<section class="tarjeta">
    <h2>Registrar materia</h2>
    <form action="#" method="post">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" maxlength="100" pattern="[A-Z][a-z A-Z]+" placeholder="Ingrese el nombre de la materia" required>
        <label for="estatus">Estatus</label>
        <select id="estatus" name="estatus">
            <option>Activo</option>
            <option>Inactivo</option>
        </select>
        <button type="submit">Guardar</button>
    </form>
</section>
<section class="tarjeta">
    <h2>Materias registrados</h2>
    <table><tr><th>Nombre</th><th>Estatus</th><th>Acciones</th></tr><tr><td>Bases de Datos</td><td>Activo</td><td><a class="boton chico" href="#">Editar</a> <a class="boton chico peligro" href="#">Eliminar</a> </td></tr><tr><td>Programación Orientada a Objetos</td><td>Activo</td><td><a class="boton chico" href="#">Editar</a> <a class="boton chico peligro" href="#">Eliminar</a> </td></tr><tr><td>Proyecto Integrador I</td><td>Activo</td><td><a class="boton chico" href="#">Editar</a> <a class="boton chico peligro" href="#">Eliminar</a> </td></tr></table>
</section>
</main>

</body>
</html>

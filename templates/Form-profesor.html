<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profesores</title>
    <link rel="stylesheet" href="../static/css/estilo.css">
</head>
<body>

<header>
    <h2>Sistema de Evaluación Docente</h2>
    <nav><a href="index.html">Inicio</a> | <a href="menu.html">Menú principal</a></nav>
</header>

<main>

<h1>Profesores</h1>

<section class="tarjeta">
    <h2>Registrar profesor</h2>

    <form id="formProfesor" action="#" method="post" novalidate>
        <label for="nombre">Nombre(s)</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="apellidoPaterno">Apellido paterno</label>
        <input type="text" id="apellidoPaterno" name="apellidoPaterno" required>

        <label for="apellidoMaterno">Apellido materno</label>
        <input type="text" id="apellidoMaterno" name="apellidoMaterno">
        <p class="nota">Opcional.</p>

        <label for="estatus">Estatus</label>
        <select id="estatus" name="estatus" required>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
        </select>

        <button type="submit">Guardar</button>
    </form>
</section>

<section class="tarjeta">
    <h2>Profesores registrados</h2>
    <table>
        <tr>
            <th>Nombre</th>
            <th>Estatus</th>
            <th>Acciones</th>
        </tr>
        <tr>
            <td>Juan Pérez López</td>
            <td>Activo</td>
            <td><a class="boton chico" href="#">Editar</a> <a class="boton chico peligro" href="#">Eliminar</a> <a class="boton chico" href="Form-asignar-materias.html">Materias</a></td>
        </tr>
        <tr>
            <td>María Hernández Ruiz</td>
            <td>Activo</td>
            <td><a class="boton chico" href="#">Editar</a> <a class="boton chico peligro" href="#">Eliminar</a> <a class="boton chico" href="Form-asignar-materias.html">Materias</a></td>
        </tr>
    </table>
</section>

</main>

<script>
    function avisar(msg, campo) {
        alert(msg);
        if (campo) {
            campo.classList.add('invalido');
            campo.focus();
        }
    }

    document.addEventListener('input', function(e) {
        e.target.classList.remove('invalido');
    });

    function limpiar(s) {
        return s.trim().replace(/\s+/g, ' ');
    }

    function validarNombre(valor) {
        if (valor === '') return 'Este campo es obligatorio.';
        if (valor.length > 150) return 'No puede superar los 150 caracteres.';

        if (!/^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]+$/.test(valor)) {
            return 'Solo se permiten letras y espacios.';
        }

        var palabras = valor.split(' ');

        for (var i = 0; i < palabras.length; i++) {
            if (palabras[i].length < 2) {
                return 'Cada palabra debe tener al menos 2 letras.';
            }
        }

        return '';
    }

    var form = document.getElementById('formProfesor');
    var nombre = document.getElementById('nombre');
    var apellidoPaterno = document.getElementById('apellidoPaterno');
    var apellidoMaterno = document.getElementById('apellidoMaterno');
    var estatus = document.getElementById('estatus');
    var tabla = document.querySelector('table');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        var nom = limpiar(nombre.value);
        var paterno = limpiar(apellidoPaterno.value);
        var materno = limpiar(apellidoMaterno.value);

        // Validar nombre
        var error = validarNombre(nom);
        if (error) {
            avisar('Nombre(s): ' + error, nombre);
            return;
        }

        // Validar apellido paterno
        error = validarNombre(paterno);
        if (error) {
            avisar('Apellido paterno: ' + error, apellidoPaterno);
            return;
        }

        // Validar apellido materno si se escribió
        if (materno !== '') {
            error = validarNombre(materno);
            if (error) {
                avisar('Apellido materno: ' + error, apellidoMaterno);
                return;
            }
        }

        // Revisar que cada campo comience con mayúscula
        if (nom[0] !== nom[0].toUpperCase()) {
            avisar('La primera letra del nombre debe ser mayúscula.', nombre);
            return;
        }

        if (paterno[0] !== paterno[0].toUpperCase()) {
            avisar('La primera letra del apellido paterno debe ser mayúscula.', apellidoPaterno);
            return;
        }

        if (materno !== '' && materno[0] !== materno[0].toUpperCase()) {
            avisar('La primera letra del apellido materno debe ser mayúscula.', apellidoMaterno);
            return;
        }

        // Validar estatus
        if (estatus.value !== 'Activo' && estatus.value !== 'Inactivo') {
            avisar('Selecciona un estatus válido.', estatus);
            return;
        }

        // Juntar los nombres sin modificar sus mayúsculas
        var valor = nom + ' ' + paterno;
        if (materno !== '') valor += ' ' + materno;

        // Revisar si el profesor ya está registrado
        for (var i = 1; i < tabla.rows.length; i++) {
            if (limpiar(tabla.rows[i].cells[0].textContent).toLowerCase() === valor.toLowerCase()) {
                avisar('Este profesor ya está registrado.', nombre);
                return;
            }
        }

        // Agregar profesor a la tabla
        var fila = tabla.insertRow(-1);
        fila.insertCell(0).textContent = valor;
        fila.insertCell(1).textContent = estatus.value;
        fila.insertCell(2).innerHTML = '<a class="boton chico" href="#">Editar</a> <a class="boton chico peligro" href="#">Eliminar</a> <a class="boton chico" href="Form-asignar-materias.html">Materias</a>';

        alert('Profesor guardado correctamente:\n' + valor + ' (' + estatus.value + ')');

        form.reset();
        nombre.focus();
    });
</script>

</body>
</html>
